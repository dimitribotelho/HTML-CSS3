<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>
    <form action="cadastro" method="post">
        <p>
            <label for="iest">Estado:</label>
            <select name="Estado" id="iest">
                <optgroup label="Sudeste">
                    <option value="Sp">Sao paulo</option>
                    <option value="rj">Rio de Janerio</option>
                    <option value="Mg">Minas Gerais</option>
                </optgroup>
                <optgroup label="Nordeste">
                    <option value="Ma">Maranhao</option>
                    <option value="Pe">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissao:</label>
            <input type="text" name="prof" id="iprof" list="lprof">
            <datalist id="lprof">
                <option>Jogador</option>
                <option>Professor</option>
                <option>Desenvolvedor</option>
                <option>Piloto</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Feedback</label> <br>
            <textarea name="msg" id="imsg" cols="50" rows="15" placeholder="Digite aqui sua mensagem"></textarea>
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
    
</body>
</html>
