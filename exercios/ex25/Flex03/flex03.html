<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.flex{
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;           
        }

        div.item{
            background-color: orange;
            border: 1px black solid;
            padding: 10px;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="item">Bloco de exemplo A</div>
        <div class="item">Bloco de exemplo B</div>
        <div class="item">Bloco de exemplo C</div>
        <div class="item">Bloco de exemplo D</div>
        <div class="item">Bloco de exemplo E</div>
        <div class="item">Bloco de exemplo F</div>
    </div>
    
</body>
</html>
