<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layuout</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
        .container{
            display: grid;
            border: 1px solid black;
            grid-template-rows: 80px 40px 1fr 40px;
            grid-template-columns: 1fr 150px;
            gap: 5px;
            width: 100vw;
            height: 100vh;
        }

        .caixa{
            background-color: lightgray;
            text-align: center;
        }

        #topo{
            grid-row: 1 / 2;
            grid-column: 1 / 3
        }

        #menu{
            grid-row: 2 / 3;
            grid-column: 1 / 3;
        }
        
        #principal{
            grid-column: 3 / 4;
            grid-row: 1 / 2;

        }

        #secundario{
            grid-column: 2 / 3;
            grid-row: 3 / 4;

        }

        #rodape{
            grid-column: 1 / 3;
            grid-row: 4 / 5;

        }
    </style>
</head>
<body>
    <div class="container">
        <header class="caixa" id="topo">Topo
        </header>
        <nav class="caixa" id="menu">Menu
        </nav>
        <main class="caixa" id="pricnipal">principal
        </main>
        <aside class="caixa" id="secundario">secundario</aside>
        <footer class="caixa" id="rodape">rodape</footer>
    </div>
</body>
</html>
