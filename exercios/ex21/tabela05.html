<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabela</title>
    <style>
        table{
            border-collapse: collapse;
            width: 300px;
            text-align: center;
            margin: auto;
        }

        caption{
            background-color: darkgray;
            padding: 10px;
            font-weight: bolder;
            border: 1px solid black;
        }

        th,td{
            border: 1px solid black;
            padding: 10px;
        }

        col.a{
            background-color: brown;
        }

        col.b{
            background-color: yellow;
        }
        col.c{
            background-color: blue;
        }
        col.d{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="a">
            <col class="b">
            <col class="c">
            <col class="d">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissao</th>
        <tr>
            <td>Ana Maria</td>
            <Td>F</Td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
         <tr>
            <td>Claudio</td>
            <Td>M</Td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <Td>M</Td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Helio</td>
            <Td>M</Td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <Td>F</Td>
            <td>39</td>
            <td>Medica</td>
        </tr>
        <tr>
            <td>Otavio</td>
            <Td>M</Td>
            <td>22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
    
</body>
</html>
