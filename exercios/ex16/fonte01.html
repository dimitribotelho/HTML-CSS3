<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes em css</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unica+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap');
        body{
            font-size: 13px;
            font-style: normal;
            font-weight: lighter;
        }

        h1{
            font-family: "Unica One", sans-serif;
        }
        p{
            font-family: "Chakra Petch", sans-serif;
        }
    </style>
</head>
<body>
    <h1>testando fontem em css</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit, harum architecto. Laudantium suscipit eligendi doloribus optio? Neque, pariatur, praesentium, harum eos possimus exercitationem ex suscipit quo unde soluta saepe impedit.</p>
</body>
</html>
