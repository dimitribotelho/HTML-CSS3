<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>
    <form action="cadastro" method="post">
        <p>
            <label for="iano">Em que ano vc nasceu?:</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" required oninput="calcular()">
            <!-- 
            <input type="number" name="ano" id="iano" min="1900" max="2026" required oninput="iidade.innerHTML = 2026 - Number(iano.value)">
            -->  
        </p>
        <p>
            <label for="iidade">Sua idade e:</label>
            <output name="idade" id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>

    <script>
        function calcular() {
            let atual = new Date().getFullYear()
            iidade.value = Number(atual) - Number(iano.value)
        }
    </script>
    
</body>
</html>
