
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens de grid</title>
    <style>
        .container{
            display: grid;
            border: 1px solid black;
            grid-template: repeat(3,100px)/repeat(4,1fr);
        }

        .caixa1{
            border: 1px solid red;
            text-align: center;
            grid-column: 1 / span 4;
            grid-row: 1 / 2;
            
        }
        .caixa2{
            border: 1px solid red;
            text-align: center;
            grid-column: 1 / 3;
            grid-row: 2 / 4;
            
        }

        .caixa3{
            border: 1px solid red;
            text-align: center;
            grid-column: 3 / 5;
            grid-row: 2 / 4;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa2</div>
        <div class="caixa3">Caixa3</div>
    </div>
    
</body>
</html>
