<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamneto vertical</title>
</head>
<style>
    #container{
        position: relative;
        height: 96vh;
        padding: 10px;
        background-color: aqua;
        background-image: url("imagens-cap19/target001.png");
        background-size: 100% 100%;
    }

    #conteudo{
        height: 200px;
        width:400px;
        background-color: chocolate;
        background-image: url("imagens-cap19/target001.png");
        background-size: 100% 100%;
        height: 200px;
        width: 400px;
        position: absolute;
        
        
        left: 50%;
        top: 50%;
        transform: translate(-50% -50%);

    }
</style>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
