<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos de caixas</title>
    <style>
        h1{
            background-color: rgb(21, 164, 116);
            height: 300px;

            padding-left: 10px;
        }
    </style>
</head>

    <h1>Exemplos de caixas</h1>
    <p>este paragrafo e um exemplo de box-level ja <a href="#">ja esse link e um exemplo de um inline box</a> logo aprenderemos mais sobre isso</p>
