<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo</title>
    <style>
        div:hover{
            color: red;
        }

        div > p {
            display: none;
        }

        div:hover > p{
            display: block;
            color: red;
            background-color: dimgrey;
        }
    </style>
</head>
<body>
    <h1>exemplo de uma hover</h1>
    <p>passe o mouse em baixo</p>
    <div>passe o mouse aqui
        <p> texto escondido</p>
    </div>
    <p>fim</p>
    
</body>
</html>
